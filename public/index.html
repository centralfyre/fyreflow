<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FyreFlow — Atividades da Equipe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <img class="logo" src="/Fyre%20-%20Logo%20Horizontal%20-%20Laranja%20e%20Branco%20-%20Laranja%20e%20Branco.svg" alt="Fyre" />
    <h1>FyreFlow</h1>
    <button id="refresh-btn" class="refresh-btn" title="Atualizar dados">↻</button>
  </header>

  <nav id="member-bar" class="member-bar">
    <p class="member-bar-loading">Carregando equipe…</p>
  </nav>

  <main id="member-panel" class="member-panel">
    <p class="empty-state panel-placeholder">Selecione uma pessoa acima para ver as atividades.</p>
  </main>

  <div id="status-banner" class="status-banner hidden"></div>

  <script src="app.js"></script>
</body>
</html>
